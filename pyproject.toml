[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldready-local"
version = "0.1.0"
description = "Local, evidence-backed survey review — early hackathon prototype"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3", "uvicorn>=0.30,<1", "httpx2"]
dev = ["ruff>=0.9,<1"]

[project.scripts]
fieldready = "fieldready.cli:main"
fieldready-mcp = "fieldready.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fieldready = ["data/*.csv", "rulesets/*.json", "web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
